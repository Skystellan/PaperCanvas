name: Desktop builds

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows-x64
          - os: macos-14
            platform: macOS-arm64
          - os: ubuntu-22.04
            platform: Linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            libfuse2 libnss3 libasound2 xvfb dbus-x11 desktop-file-utils
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run chromium:test
      - run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets --locked
      - run: npm run chromium:build
      - name: Install and test Ubuntu app
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y ./release/*-Linux-*.deb
          test -x /usr/bin/paper-canvas
          test -r /opt/PaperCanvas/resources/app.asar
          desktop-file-validate /usr/share/applications/paper-canvas.desktop
          xvfb-run -a dbus-run-session -- node electron/run-smoke.mjs /usr/bin/paper-canvas
      - name: Test Linux AppImage
        if: runner.os == 'Linux'
        run: |
          chmod +x release/*.AppImage
          APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a dbus-run-session -- node electron/run-smoke.mjs "$PWD"/release/*.AppImage
      - name: Install and test Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $installer = (Resolve-Path "release/PaperCanvas-$version-Windows-x64-Setup.exe").Path
          if (!(Test-Path release/latest.yml)) { throw 'Missing Windows update metadata' }
          if (Test-Path release/PaperCanvas-win32-x64/resources/app-update.yml) { throw 'Portable ZIP must not include installer update config' }
          $installDirectory = Join-Path $env:LOCALAPPDATA 'Programs/PaperCanvas-CI'
          $installed = Start-Process -FilePath $installer -ArgumentList '/S', '/currentuser', "/D=$installDirectory" -Wait -PassThru
          if ($installed.ExitCode -ne 0) { throw "Installer failed: $($installed.ExitCode)" }
          if (!(Test-Path "$installDirectory/resources/app-update.yml")) { throw 'Installed updater config missing' }
          if (!(Test-Path "$installDirectory/Uninstall PaperCanvas.exe")) { throw 'NSIS uninstaller missing' }
          node electron/run-smoke.mjs "$installDirectory/PaperCanvas.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test portable Windows app
        if: runner.os == 'Windows'
        run: node electron/run-smoke.mjs release/PaperCanvas-win32-x64/PaperCanvas.exe
      - name: Archive Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          Compress-Archive -Path release/PaperCanvas-win32-x64 -DestinationPath "release/PaperCanvas-$version-Windows-x64.zip"
      - name: Sign and test packaged macOS app
        if: runner.os == 'macOS'
        run: |
          codesign --force --deep --sign - release/PaperCanvas-darwin-arm64/PaperCanvas.app
          node electron/run-smoke.mjs release/PaperCanvas-darwin-arm64/PaperCanvas.app/Contents/MacOS/PaperCanvas
      - name: Archive macOS app
        if: runner.os == 'macOS'
        run: |
          version=$(node -p "require('./package.json').version")
          ditto -c -k --sequesterRsrc --keepParent release/PaperCanvas-darwin-arm64/PaperCanvas.app "release/PaperCanvas-$version-macOS-arm64.zip"
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: PaperCanvas-${{ matrix.platform }}
          path: release/*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: PaperCanvas-${{ matrix.platform }}
          path: |
            release/*.zip
            release/*-Setup.exe
            release/*-Setup.exe.blockmap
            release/latest.yml
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: PaperCanvas-${{ matrix.platform }}
          path: |
            release/*.deb
            release/*.AppImage
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Smoke-diagnostics-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/papercanvas-smoke-*/*.png
            ${{ runner.temp }}/papercanvas-smoke-*/report.json

  ubuntu-compatibility:
    needs: desktop
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: PaperCanvas-Linux-x64
          path: release
      - name: Install and test the Ubuntu 22.04 build on Ubuntu 24.04
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb dbus-x11 desktop-file-utils ./release/*-Linux-*.deb
          test -x /usr/bin/paper-canvas
          test -r /opt/PaperCanvas/resources/app.asar
          desktop-file-validate /usr/share/applications/paper-canvas.desktop
          test -f /etc/apparmor.d/paper-canvas
          xvfb-run -a dbus-run-session -- node electron/run-smoke.mjs /usr/bin/paper-canvas
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Smoke-diagnostics-Ubuntu-24.04
          path: |
            ${{ runner.temp }}/papercanvas-smoke-*/*.png
            ${{ runner.temp }}/papercanvas-smoke-*/report.json
