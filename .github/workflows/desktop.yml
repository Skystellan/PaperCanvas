name: Desktop builds

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows-x64
          - os: macos-14
            platform: macOS-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run chromium:test
      - run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --all-targets --locked
      - name: Check retained Tauri shell
        if: runner.os == 'macOS'
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets --locked
      - run: npm run chromium:build
      - name: Install and test Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $installer = (Resolve-Path "release/PaperCanvas-$version-Windows-x64-Setup.exe").Path
          if (!(Test-Path release/latest.yml)) { throw 'Missing Windows update metadata' }
          if (Test-Path release/PaperCanvas-win32-x64/resources/app-update.yml) { throw 'Portable ZIP must not include installer update config' }
          $installDirectory = Join-Path $env:LOCALAPPDATA 'Programs/PaperCanvas-CI'
          $installed = Start-Process -FilePath $installer -ArgumentList '/S', '/currentuser', "/D=$installDirectory" -Wait -PassThru
          if ($installed.ExitCode -ne 0) { throw "Installer failed: $($installed.ExitCode)" }
          if (!(Test-Path "$installDirectory/resources/app-update.yml")) { throw 'Installed updater config missing' }
          if (!(Test-Path "$installDirectory/Uninstall PaperCanvas.exe")) { throw 'NSIS uninstaller missing' }
          node electron/run-smoke.mjs "$installDirectory/PaperCanvas.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test portable Windows app
        if: runner.os == 'Windows'
        run: node electron/run-smoke.mjs release/PaperCanvas-win32-x64/PaperCanvas.exe
      - name: Archive Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          Compress-Archive -Path release/PaperCanvas-win32-x64 -DestinationPath "release/PaperCanvas-$version-Windows-x64.zip"
      - name: Sign and test packaged macOS app
        if: runner.os == 'macOS'
        run: |
          codesign --force --deep --sign - release/PaperCanvas-darwin-arm64/PaperCanvas.app
          node electron/run-smoke.mjs release/PaperCanvas-darwin-arm64/PaperCanvas.app/Contents/MacOS/PaperCanvas
      - name: Archive macOS app
        if: runner.os == 'macOS'
        run: |
          version=$(node -p "require('./package.json').version")
          ditto -c -k --sequesterRsrc --keepParent release/PaperCanvas-darwin-arm64/PaperCanvas.app "release/PaperCanvas-$version-macOS-arm64.zip"
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: PaperCanvas-${{ matrix.platform }}
          path: release/*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: PaperCanvas-${{ matrix.platform }}
          path: |
            release/*.zip
            release/*-Setup.exe
            release/*-Setup.exe.blockmap
            release/latest.yml
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Smoke-diagnostics-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/papercanvas-smoke-*/*.png
            ${{ runner.temp }}/papercanvas-smoke-*/report.json

  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    container:
      image: ubuntu:20.04
      # Allow Chromium's user namespaces inside this CI container. Electron's
      # own sandbox remains enabled and is asserted by the desktop smoke test.
      # PDF canvas rendering needs more than Docker's default 64 MB shared memory.
      options: --shm-size=1g --security-opt seccomp=unconfined --security-opt apparmor=unconfined
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Prepare Ubuntu 20.04 build environment
        run: |
          apt-get update
          apt-get install -y ca-certificates curl git build-essential pkg-config \
            libgtk-3-0 libnss3 libasound2 libgbm1 libfuse2 xvfb dbus-x11 \
            desktop-file-utils policykit-1 xz-utils
          useradd --create-home --uid 1001 paper-ci
          install -d -o paper-ci -g paper-ci /tmp/papercanvas-ci
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ubuntu-20.04-backend
          cache-on-failure: true
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run chromium:test
      - run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --all-targets --locked
      - run: npm run chromium:build
      - name: Check oldest supported glibc
        run: node electron/check-linux-abi.mjs release/PaperCanvas-linux-x64
      - name: Test Ubuntu 20.04 DEB and AppImage
        timeout-minutes: 4
        run: |
          export RUNNER_TEMP=/tmp/papercanvas-ci
          apt-get install -y ./release/*-Linux-*.deb
          test -x /usr/bin/paper-canvas
          test -r /opt/PaperCanvas/resources/app.asar
          desktop-file-validate /usr/share/applications/paper-canvas.desktop
          runuser -u paper-ci -- xvfb-run -a dbus-run-session -- node electron/run-smoke.mjs /usr/bin/paper-canvas
          chmod +x release/*.AppImage
          runuser -u paper-ci -- env APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a dbus-run-session -- node electron/run-smoke.mjs "$PWD"/release/*.AppImage
      - name: Test Ubuntu 20.04 download, install and relaunch
        timeout-minutes: 7
        run: |
          export RUNNER_TEMP=/tmp/papercanvas-ci
          test -f release/latest-linux.yml
          rule=/etc/polkit-1/localauthority/50-local.d/papercanvas-ci.pkla
          trap 'rm -f "$rule"' EXIT
          mkdir -p "$(dirname "$rule")" /run/dbus
          printf '[PaperCanvas update smoke]\nIdentity=unix-user:paper-ci\nAction=org.freedesktop.policykit.exec\nResultAny=yes\nResultInactive=yes\nResultActive=yes\n' > "$rule"
          dbus-daemon --system --fork
          runuser -u paper-ci -- xvfb-run -a dbus-run-session -- node electron/run-linux-update-smoke.mjs release /usr/bin/paper-canvas
          runuser -u paper-ci -- xvfb-run -a dbus-run-session -- node electron/run-linux-update-smoke.mjs release "$PWD"/release/*.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: PaperCanvas-Linux-x64
          path: |
            release/*.deb
            release/*.AppImage
            release/latest-linux.yml
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Smoke-diagnostics-Ubuntu-20.04
          path: |
            /tmp/papercanvas-ci/papercanvas-smoke-*/*.png
            /tmp/papercanvas-ci/papercanvas-smoke-*/report.json

  ubuntu-compatibility:
    needs: linux
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: PaperCanvas-Linux-x64
          path: release
      - name: Install and test the Ubuntu 20.04 build
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb dbus-x11 desktop-file-utils ./release/*-Linux-*.deb
          test -x /usr/bin/paper-canvas
          test -r /opt/PaperCanvas/resources/app.asar
          desktop-file-validate /usr/share/applications/paper-canvas.desktop
          if [[ "${{ matrix.os }}" == "ubuntu-24.04" ]]; then test -f /etc/apparmor.d/paper-canvas; fi
          xvfb-run -a dbus-run-session -- node electron/run-smoke.mjs /usr/bin/paper-canvas
      - name: Test AppImage on Ubuntu 22.04
        if: matrix.os == 'ubuntu-22.04'
        run: |
          chmod +x release/*.AppImage
          APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a dbus-run-session -- node electron/run-smoke.mjs "$PWD"/release/*.AppImage
      - name: Test application update
        run: |
          if [[ "${{ matrix.os }}" == "ubuntu-22.04" ]]; then
            rule=/etc/polkit-1/localauthority/50-local.d/papercanvas-ci.pkla
            sudo mkdir -p "$(dirname "$rule")"
            printf '[PaperCanvas update smoke]\nIdentity=unix-user:%s\nAction=org.freedesktop.policykit.exec\nResultAny=yes\nResultInactive=yes\nResultActive=yes\n' "$(id -un)" | sudo tee "$rule" > /dev/null
          else
            rule=/etc/polkit-1/rules.d/49-papercanvas-ci.rules
            sudo mkdir -p "$(dirname "$rule")"
            printf 'polkit.addRule(function(action, subject) { if (action.id === "org.freedesktop.policykit.exec" && action.lookup("program") === "/usr/bin/apt-get" && subject.user === "%s") return polkit.Result.YES; });\n' "$(id -un)" | sudo tee "$rule" > /dev/null
          fi
          trap 'sudo rm -f "$rule"' EXIT
          sudo systemctl restart polkit
          xvfb-run -a dbus-run-session -- node electron/run-linux-update-smoke.mjs release /usr/bin/paper-canvas
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Smoke-diagnostics-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/papercanvas-smoke-*/*.png
            ${{ runner.temp }}/papercanvas-smoke-*/report.json
