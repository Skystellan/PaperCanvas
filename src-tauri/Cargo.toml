[package]
name = "paper-canvas"
version = "0.2.0"
license = "MIT"
description = "A local-first paper whiteboard"
edition = "2021"
default-run = "paper-canvas"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "paper_canvas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["macros", "sync", "time", "rt-multi-thread"] }

sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate"] }


[[bin]]
name = "paper-canvas-backend"
path = "src/bin/backend.rs"

[dev-dependencies]
